name: HiveStrike
options:
  bundleIdPrefix: com.jnaina
  deploymentTarget:
    tvOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # set your own Apple team ID here, or pass DEVELOPMENT_TEAM=<id> to xcodebuild
    CODE_SIGN_STYLE: Automatic
targets:
  HiveStrike:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Hive Strike
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIRequiredDeviceCapabilities: [arm64]
        GCSupportsControllerUserInteraction: true
        LSApplicationCategoryType: public.app-category.arcade-games
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jnaina.pulstar
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        GCC_OPTIMIZATION_LEVEL: s
        SWIFT_COMPILATION_MODE: wholemodule
        ENABLE_BITCODE: NO
